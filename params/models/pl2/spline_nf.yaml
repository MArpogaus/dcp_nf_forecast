compile_kwargs: {}
fit_kwargs:
  batch_size: 256
  early_stopping_patience: 20
  epochs: 400
  learning_rate:
    scheduler_kwargs:
      decay_steps: 22000
      initial_learning_rate: 0.0005
    scheduler_name: CosineDecay
  verbose: true
model_kwargs:
  base_distribution_kwargs:
    distribution_name: normal
  bijector: RationalQuadraticSpline
  bijector_kwargs:
    range_min: -4
  distribution: masked_autoregressive_flow
  num_layers: 1
  num_parameters: 35
  parameters_constraint_fn: hybrid_flows.activations.get_spline_param_constrain_fn
  parameters_constraint_fn_kwargs:
    interval_width: 8
    min_bin_width: 0.001
    min_slope: 0.001
    nbins: 12
  parameters_fn_kwargs:
    activation: relu
    conditional: true
    hidden_units:
    - 256
    - 256
