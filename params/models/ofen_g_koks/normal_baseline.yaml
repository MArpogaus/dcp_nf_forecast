compile_kwargs:
  jit_compile: false
fit_kwargs:
  batch_size: 256
  early_stopping_patience: 10
  epochs: 200
  learning_rate:
    scheduler_name: CosineDecay
    scheduler_kwargs:
      initial_learning_rate: 0.001
      decay_steps: 22000
  verbose: true
model_kwargs:
  distribution: multivariate_normal
  parameters_fn_kwargs:
    activation: relu
    conditional: true
    hidden_units:
    - 128
    - 128
