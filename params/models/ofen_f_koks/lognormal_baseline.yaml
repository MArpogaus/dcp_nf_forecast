compile_kwargs:
  jit_compile: false
fit_kwargs:
  batch_size: 256
  early_stopping_patience: 10
  epochs: 200
  learning_rate:
    scheduler_kwargs:
      decay_steps: 22000
      initial_learning_rate: 0.001
    scheduler_name: CosineDecay
  verbose: true
model_kwargs:
  distribution: multivariate_lognormal
  parameters_fn_kwargs:
    activation: relu
    batch_norm: false
    conditional: true
    dropout: 0
    hidden_units:
    - 128
    - 128
