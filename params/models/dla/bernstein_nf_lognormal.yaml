compile_kwargs: {}
fit_kwargs:
  batch_size: 256
  early_stopping_patience: 20
  epochs: 400
  learning_rate:
    scheduler_name: CosineDecay
    scheduler_kwargs: {initial_learning_rate: 0.001, decay_steps: 22000}
  verbose: true
model_kwargs:
  base_distribution_kwargs: {distribution_name: lognormal}
  distribution: masked_autoregressive_flow
  nested_bijectors:
  - bijector: BernsteinPolynomial
    bijector_kwargs:
      domain: [0.0, 148.413]
      extrapolation: false
    invert: true
    parameters_constraint_fn: hybrid_flows.activations.get_thetas_constrain_fn
    parameters_constraint_fn_kwargs: {allow_flexible_bounds: false, bounds: none, high: 148.413159, low: 0.006738}
    parameters_fn: parameter_vector_or_simple_network
    parameters_fn_kwargs:
      activation: relu
      batch_norm: false
      conditional: true
      dropout: 0
      hidden_units: [256, 256]
      parameter_shape: [48, 16]
    parameters_slice_size: 16
  num_layers: 1
  num_parameters: 16
  maf_kwargs: {bijector_kwargs: {unroll_loop: true}}
  parameters_fn_kwargs:
    activation: relu
    hidden_units: [128, 128]
