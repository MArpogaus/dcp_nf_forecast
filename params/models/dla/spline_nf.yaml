compile_kwargs: {}
fit_kwargs:
  batch_size: 256
  early_stopping_patience: 10
  epochs: 200
  learning_rate:
    scheduler_name: CosineDecay
    scheduler_kwargs:
      initial_learning_rate: 0.001
      decay_steps: 22000
  verbose: true
model_kwargs:
  distribution: masked_autoregressive_flow
  num_layers: 1
  bijector: RationalQuadraticSpline
  bijector_kwargs:
    range_min: -4
  base_distribution_kwargs:
    distribution_name: normal
  num_parameters: 23
  parameters_constraint_fn: hybrid_flows.activations.get_spline_param_constrain_fn
  parameters_constraint_fn_kwargs:
    interval_width: 8
    min_slope: 0.001
    min_bin_width: 0.001
    nbins: 8
  parameters_fn_kwargs:
    activation: relu
    hidden_units:
    - 128
    - 128
    conditional: true
