          lag_columns: pl2_stromverbrauch_kwh:96
        test_mode: false
      params/models/dla/bernstein_nf.yaml:
        compile_kwargs: {}
        fit_kwargs:
          batch_size: 256
          early_stopping_patience: 10
          epochs: 100
          learning_rate: 0.0005
          verbose: true
