          future_columns: is_holiday:48,ofen_metall_kg:48
          fillna_columns: ofen_g_koks_kg,ofen_f_koks_kg,ofen_metall_kg
          fillna_value: 0.0
          fillna_noise_type: lognormal
          fillna_noise_scale: 0.005
        - name: pl2
          y_column: pl2_stromverbrauch_kwh
          prediction_horizon: 48
          lag_columns: pl2_stromverbrauch_kwh:96
          tabular_covariate_columns: none
          future_columns: is_holiday:48
          fillna_columns: none
          fillna_value: 0.0
          fillna_noise_type: lognormal
          fillna_noise_scale: 0.0
