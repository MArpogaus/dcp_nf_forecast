            - 1
            extrapolation: false
          invert: true
          base_distribution_kwargs:
            distribution_name: normal
          num_parameters: 96
          parameters_constraint_fn:
            hybrid_flows.activations.get_thetas_constrain_fn
          parameters_constraint_fn_kwargs:
            allow_flexible_bounds: false
            bounds: none
            low: 0.007
            high: 148
          parameters_fn_kwargs:
            activation: relu
            hidden_units:
            - 256
            - 256
            - 256
            conditional: true
