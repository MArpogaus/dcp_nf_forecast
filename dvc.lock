          prediction_horizon: 48
          lag_columns: dla_stromverbrauch_kwh:96
          tabular_covariate_columns: none
          future_columns: is_holiday:48
          fillna_columns: none
          fillna_value: 0.0
          fillna_noise_type: lognormal
          fillna_noise_scale: 0.0
