[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61", "setuptools_scm>=7"]

[project]
dependencies = [
  "holidays==0.97",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "pyyaml==6.0.3",
  "hybrid-flows @ git+https://github.com/MArpogaus/hybrid-flows.git@v0.1.0",
  "tensorflow==2.15.1",
  "tensorflow-probability==0.23.0",
  "pyarrow==23.0.1",
  "mlflow==3.12.0"
]
description = "Forecasting with multivariate normalizing flows"
dynamic = ["version"]
name = "dcp-nf-forecast"
requires-python = ">=3.11"

[project.optional-dependencies]
cuda = [
  'dcp-nf-forecast[train]',
  'tensorflow[and-cuda]'
]
dev = [
  "commitizen==4.16.2",
  "mypy==2.1.0",
  "pre-commit==4.6.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "python-lsp-ruff==2.3.1",
  "python-lsp-server==1.14.0",
  "ruff==0.15.13"
]
train = [
  "dvc[webdav,ssh]==3.67.1"
]

[tool.commitizen]
major_version_zero = true
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "scm"
version_scheme = "pep440"

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.run]
branch = true
omit = ["test/*", "scripts/*"]
source = ["src/dcp_nf_forecast"]

[tool.pytest.ini_options]
addopts = ["-v", "--tb=short", "-n", "auto", "--dist=loadfile"]
markers = ["slow", "integration"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["test"]

[tool.ruff]
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["I", "E", "F", "D", "UP"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["D"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# https://stackoverflow.com/a/74404703
# omits local version, useful because pypi does not support it
local_scheme = "no-local-version"
