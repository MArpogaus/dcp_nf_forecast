stages:
  describe:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/describe_data.py
        --processed-dir ${paths.data_processed}/${item.name}
        --target-name ${item.name}
        --data-format ${data.data_format}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/describe_data.py
      - src/dcp_nf_forecast/
      - data/processed/${item.name}/
      params:
      - paths.data_processed
      - data.data_format
      - targets
      - log_level
      - log_file
      outs:
      - results/${item.name}/data_description/statistics_train.yaml
      - results/${item.name}/data_description/statistics_val.yaml
      - results/${item.name}/data_description/histograms_train.pdf
      - results/${item.name}/data_description/histograms_val.pdf
      - results/${item.name}/data_description/timeseries_train.pdf
      - results/${item.name}/data_description/timeseries_val.pdf
      - results/${item.name}/data_description/correlation_train.pdf
      - results/${item.name}/data_description/correlation_val.pdf

  prepare:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/prepare_features.py
        --raw-data-path ${paths.raw_data}
        --datetime-column ${data.datetime_column}
        --fillna-method ${data.fillna_method}
        --tabular-covariate-columns ${data.tabular_covariate_columns}
        --time-components ${data.time_components}
        --target-name ${item.name}
        --y-column ${item.y_column}
        --prediction-horizon ${item.prediction_horizon}
        --lag-columns ${item.lag_columns}
        --output-dir ${paths.data_interim}/${item.name}
        --data-format ${data.data_format}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/prepare_features.py
      - src/dcp_nf_forecast/
      - ${paths.raw_data}
      params:
      - paths.raw_data
      - paths.data_interim
      - data.datetime_column
      - data.fillna_method
      - data.tabular_covariate_columns
      - data.data_format
      - data.time_components
      - targets
      - log_level
      - log_file
      outs:
      - data/interim/${item.name}/X.feather
      - data/interim/${item.name}/y.feather

  split:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/split_data.py
        --input-dir ${paths.data_interim}/${item.name}
        --output-dir ${paths.data_processed}/${item.name}
        --train-ratio ${splits.train}
        --val-ratio ${splits.val}
        --test-ratio ${splits.test}
        --data-format ${data.data_format}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/split_data.py
      - src/dcp_nf_forecast/
      - data/interim/${item.name}/
      params:
      - paths.data_interim
      - paths.data_processed
      - data.data_format
      - splits
      - log_level
      - log_file
      outs:
      - data/processed/${item.name}/X_train.feather
      - data/processed/${item.name}/y_train.feather
      - data/processed/${item.name}/X_val.feather
      - data/processed/${item.name}/y_val.feather
      - data/processed/${item.name}/X_test.feather
      - data/processed/${item.name}/y_test.feather

  train_bernstein:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/train.py
        --processed-dir ${paths.data_processed}/${item.name}
        --target-name ${item.name}
        --model bernstein_nf
        --data-format ${data.data_format}
        --prediction-horizon ${item.prediction_horizon}
        --stage-name train_bernstein
        --test-mode ${test_mode}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/train.py
      - src/dcp_nf_forecast/
      - data/processed/${item.name}/
      - params/models/${item.name}/bernstein_nf.yaml
      params:
      - params/models/${item.name}/bernstein_nf.yaml:
      - paths.data_processed
      - data.data_format
      - targets
      - seed
      - test_mode
      - log_level
      - log_file
      outs:
      - results/${item.name}/bernstein_nf/model_weights.h5
      metrics:
      - results/${item.name}/bernstein_nf/metrics.yaml

  train_spline:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/train.py
        --processed-dir ${paths.data_processed}/${item.name}
        --target-name ${item.name}
        --model spline_nf
        --data-format ${data.data_format}
        --prediction-horizon ${item.prediction_horizon}
        --stage-name train_spline
        --test-mode ${test_mode}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/train.py
      - src/dcp_nf_forecast/
      - data/processed/${item.name}/
      - params/models/${item.name}/spline_nf.yaml
      params:
      - params/models/${item.name}/spline_nf.yaml:
      - paths.data_processed
      - data.data_format
      - targets
      - seed
      - test_mode
      - log_level
      - log_file
      outs:
      - results/${item.name}/spline_nf/model_weights.h5
      metrics:
      - results/${item.name}/spline_nf/metrics.yaml

  evaluate_bernstein:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/evaluate.py
        --processed-dir ${paths.data_processed}/${item.name}
        --target-name ${item.name}
        --model bernstein_nf
        --data-format ${data.data_format}
        --prediction-horizon ${item.prediction_horizon}
        --n-samples ${eval.n_samples}
        --stage-name evaluate_bernstein
        --test-mode ${test_mode}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/evaluate.py
      - src/dcp_nf_forecast/
      - data/processed/${item.name}/
      - results/${item.name}/bernstein_nf/model_weights.h5
      - params/models/${item.name}/bernstein_nf.yaml
      params:
      - params/models/${item.name}/bernstein_nf.yaml:
      - data.data_format
      - targets
      - seed
      - test_mode
      - eval.n_samples
      - log_level
      - log_file
      outs:
      - results/${item.name}/bernstein_nf/evaluation/forecast.pdf
      - results/${item.name}/bernstein_nf/evaluation/pit_histogram.pdf
      - results/${item.name}/bernstein_nf/evaluation/calibration.pdf
      metrics:
      - results/${item.name}/bernstein_nf/evaluation/metrics.yaml

  evaluate_spline:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/evaluate.py
        --processed-dir ${paths.data_processed}/${item.name}
        --target-name ${item.name}
        --model spline_nf
        --data-format ${data.data_format}
        --prediction-horizon ${item.prediction_horizon}
        --n-samples ${eval.n_samples}
        --stage-name evaluate_spline
        --test-mode ${test_mode}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/evaluate.py
      - src/dcp_nf_forecast/
      - data/processed/${item.name}/
      - results/${item.name}/spline_nf/model_weights.h5
      - params/models/${item.name}/spline_nf.yaml
      params:
      - params/models/${item.name}/spline_nf.yaml:
      - data.data_format
      - targets
      - seed
      - test_mode
      - eval.n_samples
      - log_level
      - log_file
      outs:
      - results/${item.name}/spline_nf/evaluation/forecast.pdf
      - results/${item.name}/spline_nf/evaluation/pit_histogram.pdf
      - results/${item.name}/spline_nf/evaluation/calibration.pdf
      metrics:
      - results/${item.name}/spline_nf/evaluation/metrics.yaml
