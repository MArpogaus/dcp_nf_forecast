stages:
  describe:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/describe_data.py
        --processed-dir ${paths.data_processed}/${item.name}
        --target-name ${item.name}
        --data-format ${data.data_format}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/describe_data.py
      - src/dcp_nf_forecast/
      - data/processed/${item.name}/
      params:
      - paths.data_processed
      - data.data_format
      - targets
      - log_level
      - log_file
      outs:
      - results/${item.name}/data_description/statistics_train.yaml
      - results/${item.name}/data_description/statistics_val.yaml
      - results/${item.name}/data_description/histograms_train.pdf
      - results/${item.name}/data_description/histograms_val.pdf
      - results/${item.name}/data_description/timeseries_train.pdf
      - results/${item.name}/data_description/timeseries_val.pdf
      - results/${item.name}/data_description/correlation_train.pdf
      - results/${item.name}/data_description/correlation_val.pdf

  prepare:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/prepare_features.py
        --raw-data-path ${paths.raw_data}
        --datetime-column ${data.datetime_column}
        --tabular-covariate-columns ${data.tabular_covariate_columns}
        --time-components ${data.time_components}
        --target-name ${item.name}
        --y-column ${item.y_column}
        --prediction-horizon ${item.prediction_horizon}
        --lag-columns ${item.lag_columns}
        --output-dir ${paths.data_interim}/${item.name}
        --data-format ${data.data_format}
        --log-level ${log_level}
        --log-file ${log_file}
        --holiday-country ${data.holiday_country}
        --end-date ${data.end_date}
      deps:
      - scripts/prepare_features.py
      - src/dcp_nf_forecast/
      - ${paths.raw_data}
      params:
      - paths.raw_data
      - paths.data_interim
      - data.datetime_column
      - data.tabular_covariate_columns
      - data.data_format
      - data.time_components
      - data.holiday_country
      - data.end_date
      - targets
      - log_level
      - log_file
      outs:
      - data/interim/${item.name}/X.feather
      - data/interim/${item.name}/y.feather

  split:
    foreach: ${targets}
    do:
      cmd: >
        python scripts/split_data.py
        --input-dir ${paths.data_interim}/${item.name}
        --output-dir ${paths.data_processed}/${item.name}
        --train-ratio ${splits.train}
        --val-ratio ${splits.val}
        --test-ratio ${splits.test}
        --data-format ${data.data_format}
        --log-level ${log_level}
        --log-file ${log_file}
      deps:
      - scripts/split_data.py
      - src/dcp_nf_forecast/
      - data/interim/${item.name}/
      params:
      - paths.data_interim
      - paths.data_processed
      - data.data_format
      - splits
      - log_level
      - log_file
      outs:
      - data/processed/${item.name}/X_train.feather
      - data/processed/${item.name}/y_train.feather
      - data/processed/${item.name}/X_val.feather
      - data/processed/${item.name}/y_val.feather
      - data/processed/${item.name}/X_test.feather
      - data/processed/${item.name}/y_test.feather

  train:
    matrix:
      dataset: ${targets}
      model: ${models}
    cmd: >
      python scripts/train.py
      --model ${item.model}
      --stage-name train@${key}
      --target-name ${item.dataset.name}
    deps:
    - scripts/train.py
    - src/dcp_nf_forecast/
    - data/processed/${item.dataset.name}/
    params:
    - params/models/${item.dataset.name}/${item.model}.yaml:
    - seed
    - data.data_format
    - experiment_name
    - log_file
    - log_level
    - paths.data_processed
    - test_mode
    outs:
    - results/${item.dataset.name}/${item.model}/model_weights.h5
    - results/${item.dataset.name}/${item.model}/parent_run_id.txt
    metrics:
    - results/${item.dataset.name}/${item.model}/metrics.yaml

  evaluate:
    matrix:
      dataset: ${targets}
      model: ${models}
    cmd: >
      python scripts/evaluate.py
      --model ${item.model}
      --stage-name evaluate@${key}
      --target-name ${item.dataset.name}
      --prediction-horizon ${item.dataset.prediction_horizon}
    deps:
    - scripts/evaluate.py
    - src/dcp_nf_forecast/
    - data/processed/${item.dataset.name}/
    - results/${item.dataset.name}/${item.model}/model_weights.h5
    - results/${item.dataset.name}/${item.model}/parent_run_id.txt
    params:
    - params/models/${item.dataset.name}/${item.model}.yaml:
    - seed
    - data.data_format
    - eval.n_samples
    - experiment_name
    - log_file
    - log_level
    - paths.data_processed
    - test_mode
    outs:
    - results/${item.dataset.name}/${item.model}/evaluation/forecast.pdf
    - results/${item.dataset.name}/${item.model}/evaluation/pit_histogram.pdf
    - results/${item.dataset.name}/${item.model}/evaluation/qq_plot.pdf
    metrics:
    - results/${item.dataset.name}/${item.model}/evaluation/metrics.yaml
